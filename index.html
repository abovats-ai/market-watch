<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6366f1"><title>Sufiaxy</title>
<style>
:root{--bg:#f3f4f8;--c:#fff;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--g:#059669;--r:#dc2626;--y:#d97706;--a:#6366f1;--h:#eef0ff}
@media(prefers-color-scheme:dark){:root{--bg:#070a12;--c:#0f1420;--t:#e8ecf5;--m:#8290a8;--b:#1d2536;--g:#34d399;--r:#f87171;--y:#fbbf24;--a:#818cf8;--h:#141a33}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t)}
.hero{background:radial-gradient(900px 300px at 15% -20%,#6366f155,transparent),radial-gradient(700px 260px at 90% 0,#22d3ee33,transparent);border-bottom:1px solid var(--b)}
.w{max-width:1200px;margin:auto;padding:18px}h1{margin:0;font-size:26px;letter-spacing:-.5px}h2{margin:30px 0 12px;font-size:18px}.m{color:var(--m);font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:6px;animation:p 1.6s infinite}@keyframes p{50%{opacity:.25}}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}.kp div{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px}.kp b{font-size:22px;display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}input,select,.ch{padding:10px 12px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t);font:inherit}input{flex:1;min-width:140px}.ch{cursor:pointer}.ch.on{background:var(--a);border-color:var(--a);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:14px;transition:.15s}.card:hover{transform:translateY(-2px);border-color:var(--a)}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px}.s{font-weight:700;font-size:18px}.nm{font-size:11px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.up{color:var(--g)}.dn{color:var(--r)}.tag{font-size:10px;background:var(--a);color:#fff;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.bd{font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;color:#fff;white-space:nowrap}.SB{background:#047857}.B{background:#10b981}.H{background:var(--y)}.S{background:#f97316}.SS{background:#b91c1c}
.sc{height:6px;background:var(--b);border-radius:4px;margin:10px 0 4px;overflow:hidden}.sc i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#22d3ee)}
.pl{font-size:10px;padding:2px 7px;border-radius:6px;border:1px solid var(--b);color:var(--m);margin-right:4px}.hl{color:var(--g);border-color:var(--g)}.hn{color:var(--r);border-color:var(--r)}
.an{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;font-size:11px;color:var(--m)}.an b{display:block;color:var(--t);font-size:12px}
.rg{height:4px;background:var(--b);border-radius:3px;position:relative;margin-top:4px}.rg i{position:absolute;top:-3px;width:4px;height:10px;background:var(--a);border-radius:2px}
a{color:var(--a);text-decoration:none;display:block;margin-top:6px;font-size:12.5px}.e{font-size:12px;color:var(--m)}
#am{display:none;position:fixed;inset:0;background:#000a;z-index:90;padding:14px;overflow:auto}#am .bx{max-width:640px;margin:auto;background:var(--c);border:1px solid var(--b);border-radius:16px;padding:16px}
.al{border:1px solid var(--b);border-radius:12px;padding:10px;margin-top:8px}
</style></head><body><div id="gt" style="position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px"><div class="card" style="width:100%;max-width:340px;display:grid;gap:10px;text-align:center"><h1 style="font-size:24px">📈 Sufiaxy</h1><div class="m">Enter your access code</div><input id="gi" type="password" inputmode="numeric" placeholder="Access code" style="text-align:center"><div class="dn" id="ge" style="font-size:12px"></div><button class="ch on" id="gb">Enter</button></div></div>
<script>
(()=>{const H="6cda337034fbc7dff15e3035e991ba96494108feea54e2665df600f1811f3e45",g=id=>document.getElementById(id);
const hx=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const open=()=>g('gt').style.display='none';
try{if(localStorage.getItem('sx')===H)open()}catch(e){}
const go=async()=>{if(await hx(g('gi').value.trim())===H){try{localStorage.setItem('sx',H)}catch(e){}open()}else g('ge').textContent='Wrong code'};
g('gb').onclick=go;g('gi').onkeydown=e=>{if(e.key=='Enter')go()}})();
</script>

<div class="hero"><div class="w"><div class="top"><h1>📈 Sufiaxy</h1><div><button class="ch" id="bell">🔔 Alerts <b id="bn">0</b></button> <span class="m"><span class="dot"></span><span id="u">Loading…</span></span></div></div>
<div class="m" style="margin-top:6px">Algorithmic signals from momentum, analyst consensus, news tone, 52-week trend and earnings. Not financial advice; small caps carry high risk. Halal flags are a screen only, so verify with a certified source.</div>
<div class="kp" id="kp"></div></div></div>
<div class="w"><div class="bar"><input id="q" placeholder="Search ticker or company…"><select id="so"><option value="score">Sort: Score</option><option value="p">Sort: Price</option><option value="chg">Sort: Daily change</option><option value="s">Sort: A–Z</option></select><select id="se"></select><button class="ch" id="hf">☪ Halal-friendly</button></div>
<div class="bar" id="ch"></div><div id="app"></div><h2>Market headlines</h2><div id="mk"></div></div>
<div id="dm" style="display:none;position:fixed;inset:0;background:#000a;z-index:90;padding:14px;overflow:auto"><div class="bx" style="max-width:680px;margin:auto;background:var(--c);border:1px solid var(--b);border-radius:16px;padding:16px"><div class="row"><h2 style="margin:0" id="dt"></h2><button class="ch" id="dc">Close</button></div><div id="db"></div></div></div>
<div id="am"><div class="bx"><div class="row"><h2 style="margin:0">🔔 Alerts</h2><button class="ch" id="ac">Close</button></div><div id="al"></div></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cls={"Strong Buy":"SB","Buy":"B","Hold":"H","Sell":"S","Strong Sell":"SS"};
let D=null,F="All",Q="",SO="score",SE="All",HF=false;
const spark=h=>{if(!h||h.length<2)return'<div class="e" style="height:34px">Chart builds as updates run</div>';const lo=Math.min(...h),hi=Math.max(...h),r=hi-lo||1,c=h[h.length-1]>=h[0]?'var(--g)':'var(--r)';
 return`<svg viewBox="0 0 100 30" preserveAspectRatio="none" style="width:100%;height:34px"><polyline fill="none" stroke="${c}" stroke-width="1.5" vector-effect="non-scaling-stroke" points="${h.map((v,i)=>(i/(h.length-1)*100).toFixed(1)+','+(28-(v-lo)/r*26).toFixed(1)).join(' ')}"/></svg>`};
const hb=r=>r.halal=='yes'?'<span class="pl hl">☪ Halal</span>':r.halal=='no'?'<span class="pl hn">Non-halal sector</span>':'<span class="pl">☪ Verify</span>';
const card=r=>{const p=r.prof||{},pos=p.hi>p.lo?Math.max(0,Math.min(100,(r.p-p.lo)/(p.hi-p.lo)*100)):null;
return`<div class="card" data-s="${esc(r.s)}" style="cursor:pointer"><div class="row"><div><span class="s">${esc(r.s)}</span>${r.pri?'<span class="tag">yours</span>':''}<span class="stb" data-f="${esc(r.s)}">${window.fv&&fv(r.s)?'★':'☆'}</span><span class="stb" data-c="${esc(r.s)}">⚖</span><div class="nm">${esc(p.name)}</div></div><span class="bd ${cls[r.rating]}">${r.rating}</span></div>
<div class="row" style="margin-top:8px"><span style="font-size:17px">$${r.p.toFixed(2)} <b class="${r.chg>=0?'up':'dn'}" style="font-size:13px">${r.chg>=0?'+':''}${r.chg.toFixed(2)}%</b></span><b>${r.score}/10 · ${Math.round(r.score*10)}%</b></div>
<div class="sc"><i style="width:${r.score*10}%"></i></div>${spark(r.hist)}${window.ol?ol(r):''}
<div style="margin:6px 0"><span class="pl">${esc(r.sec)}</span>${hb(r)}</div>
<div class="an"><div><b>${r.an?r.an.strongBuy+r.an.buy+' / '+r.an.hold+' / '+(r.an.sell+r.an.strongSell):'–'}</b>Buy/Hold/Sell</div><div><b>${p.pe?p.pe.toFixed(1):'–'}</b>P/E</div><div><b>${p.beta?p.beta.toFixed(2):'–'}</b>Beta</div></div>
${pos!==null?`<div class="e">52-wk range $${p.lo.toFixed(2)} – $${p.hi.toFixed(2)}</div><div class="rg"><i style="left:${pos}%"></i></div>`:''}
<div class="e" style="margin-top:6px">News tone ${r.sent>0?'▲':r.sent<0?'▼':'•'} ${r.sent}${r.earn?' · Earnings '+esc(r.earn):''}</div>
${r.news.slice(0,2).map(n=>`<a href="${esc(n.u)}" target="_blank" rel="noopener">${esc(n.h)} <span class="m">— ${esc(n.src)}</span></a>`).join('')}</div>`};
const ok=r=>(F=="All"||r.rating==F)&&(SE=="All"||r.sec==SE)&&(!HF||r.halal!="no")&&(r.s.includes(Q)||(r.prof.name||'').toUpperCase().includes(Q));
const srt=a=>[...a].sort((x,y)=>SO=='s'?x.s.localeCompare(y.s):SO=='p'?x.p-y.p:y[SO]-x[SO]);
const sec=(t,a)=>{a=srt(a.filter(ok));return a.length?`<h2>${esc(t)}</h2><div class="grid">${a.map(card).join('')}</div>`:''};
function draw(){if(!D)return;const u=D._all,n=k=>u.filter(r=>r.rating==k).length;
 document.getElementById('kp').innerHTML=`<div>Strong Buy<b class="up">${n("Strong Buy")}</b></div><div>Buy<b class="up">${n("Buy")}</b></div><div>Hold<b>${n("Hold")}</b></div><div>Sell<b class="dn">${n("Sell")+n("Strong Sell")}</b></div><div>Tracked<b>${u.length}</b></div>`;
 document.getElementById('ch').innerHTML=["All","Strong Buy","Buy","Hold","Sell","Strong Sell"].map(k=>`<button class="ch ${k==F?'on':''}" onclick="F='${k}';draw()">${k}</button>`).join('');
 const ss=["All",...new Set(u.map(r=>r.sec))].sort();document.getElementById('se').innerHTML=ss.map(s=>`<option ${s==SE?'selected':''} value="${s}">${s=="All"?"All sectors":s}</option>`).join('');
 document.getElementById('hf').classList.toggle('on',HF);
 document.getElementById('app').innerHTML=sec('⭐ Your priority tickers',D.watchlist.filter(r=>r.pri))+D.tiers.map(t=>sec('Top picks: '+t.label,t.stocks)).join('')+sec('Full watchlist',D.watchlist.filter(r=>!r.pri));
 document.getElementById('mk').innerHTML=D.market.map(n=>`<a href="${esc(n.u)}" target="_blank" rel="noopener">${esc(n.h)} <span class="m">— ${esc(n.src)}</span></a>`).join('');
 const hc=u.filter(r=>r.score>=8.5&&r.sent>=1).length;document.getElementById('bn').textContent=hc+(D.events||[]).length+(D.breaking||[]).length;
 document.getElementById('u').textContent='Live · updated '+new Date(D.updated).toLocaleString();}
document.getElementById('bell').onclick=()=>{const u=D._all,hc=u.filter(r=>r.score>=8.5&&r.sent>=1).sort((a,b)=>b.score-a.score);
 const tl=a=>a.length?a.map(esc).join(', '):'none tracked';
 document.getElementById('al').innerHTML=
 '<h3>World events and likely impact</h3>'+((D.events||[]).map(e=>`<div class="al"><b>${esc(e.name)}</b><a href="${esc(e.u)}" target="_blank" rel="noopener">${esc(e.h)} — ${esc(e.src)}</a><div class="e"><span class="up">Possible positive:</span> ${tl(e.up)}</div><div class="e"><span class="dn">Possible negative:</span> ${tl(e.dn)}</div></div>`).join('')||'<p class="m">No major world events detected in the latest headlines.</p>')+
 '<h3>Breaking stock moves</h3>'+((D.breaking||[]).map(b=>`<div class="al"><b>${esc(b.s)}</b> <span class="${b.chg>=0?'up':'dn'}">${b.chg.toFixed(1)}% today</span> · news tone ${b.sent}</div>`).join('')||'<p class="m">None right now.</p>')+
 '<h3>High-conviction signals</h3>'+(hc.map(r=>`<div class="al"><b>${esc(r.s)}</b> $${r.p.toFixed(2)} · <b>${r.score}/10 ${r.rating}</b><div class="e">Strong score with positive recent news${r.an?`, ${r.an.strongBuy+r.an.buy} analyst buys`:''}.</div></div>`).join('')||'<p class="m">None right now.</p>')+
 '<p class="m">Impact estimates come from headline keywords and sector mapping, so treat them as prompts to research, not certainties. Not financial advice.</p>';document.getElementById('am').style.display='block'};
document.getElementById('ac').onclick=()=>document.getElementById('am').style.display='none';
async function load(){try{D=await (await fetch('data.json?t='+Date.now())).json();draw()}catch(e){document.getElementById('u').textContent='No data yet. Run the GitHub Action once.'}}
q.oninput=e=>{Q=e.target.value.toUpperCase();draw()};so.onchange=e=>{SO=e.target.value;draw()};se.onchange=e=>{SE=e.target.value;draw()};hf.onclick=()=>{HF=!HF;draw()};
const f=(v,d=2,s='')=>v==null||isNaN(v)?'–':(+v).toFixed(d)+s;
document.getElementById('app').onclick=e=>{if(e.target.closest('a,.stb'))return;const c=e.target.closest('.card');if(c)deepScan(c.dataset.s)};
document.getElementById('dc').onclick=()=>document.getElementById('dm').style.display='none';
window.cp=t=>{try{navigator.clipboard.writeText(t)}catch(e){}};
function deepScan(sym){const r=D._all.find(x=>x.s==sym),p=r.prof||{},m=p.mx||{},x=p.x||{},dp=r.deep,an=r.an;
 const pos=p.hi>p.lo?(r.p-p.lo)/(p.hi-p.lo)*100:null,nn=v=>v==null?null:v;
 const C=[["Revenue growth above 10% (TTM)",nn(m.revenueGrowthTTMYoy)==null?null:m.revenueGrowthTTMYoy>10],["EPS growth above 10% (TTM)",nn(m.epsGrowthTTMYoy)==null?null:m.epsGrowthTTMYoy>10],["Profitable (net margin above 0)",nn(m.netProfitMarginTTM)==null?null:m.netProfitMarginTTM>0],["Gross margin above 30%",nn(m.grossMarginTTM)==null?null:m.grossMarginTTM>30],["Return on equity above 12%",nn(m.roeTTM)==null?null:m.roeTTM>12],["Debt to equity below 1.5",nn(m['totalDebt/totalEquityQuarterly'])==null?null:m['totalDebt/totalEquityQuarterly']<1.5],["Current ratio above 1.2",nn(m.currentRatioQuarterly)==null?null:m.currentRatioQuarterly>1.2],["Interest coverage above 3",nn(m.netInterestCoverageTTM)==null?null:m.netInterestCoverageTTM>3],["Positive free cash flow",nn(m.pfcfShareTTM)==null?null:m.pfcfShareTTM>0],["P/E positive and below 35",p.pe==null?null:p.pe>0&&p.pe<35],["Price/sales below 10",nn(m.psTTM)==null?null:m.psTTM<10],["Beat estimates 3 of last 4 quarters",dp&&dp.n?dp.beats>=3:null],["Insiders net buying (90 days)",dp&&(dp.ib+dp.is)?dp.ib>dp.is:null],["Analysts lean buy",an?(an.strongBuy+an.buy)>(an.hold+an.sell+an.strongSell):null],["Positive 26-week momentum",nn(m['26WeekPriceReturnDaily'])==null?null:m['26WeekPriceReturnDaily']>0],["Above bottom third of 52-week range",pos==null?null:pos>33]];
 const av=C.filter(c=>c[1]!==null),ps=av.filter(c=>c[1]).length;
 const ln=(a,b)=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--b)"><span class="m">${a}</span><b>${b}</b></div>`;
 const blk=(t,rows)=>`<h3 style="margin:16px 0 4px">${t}</h3>`+rows.join('');
 const sheet=`${sym} decision sheet\n1 Thesis (3 lines):\n2 What the market believes:\n3 Where I disagree and why:\n4 Base/bull/bear value:\n5 What must go right at $${r.p}:\n6 Invalidation:\n7 Horizon:\n8 Position size:\n9 Re-check quarterly:`;
 document.getElementById('dt').textContent=sym+' · '+(p.name||'')+' — deep scan';
 document.getElementById('db').innerHTML=`<div class="al"><b>${ps} of ${av.length} checks passed</b> <span class="m">(${C.length-av.length} lack data)</span><div class="sc"><i style="width:${av.length?ps/av.length*100:0}%"></i></div></div>`+
 blk('Checklist',C.map(c=>ln(c[0],c[1]===null?'<span class="m">n/a</span>':c[1]?'<span class="up">Pass</span>':'<span class="dn">Fail</span>')))+
 blk('1 · Identity',[ln('Exchange / country',(x.exchange||'–')+' / '+(x.country||'–')),ln('Currency',x.currency||'–'),ln('Market cap',x.marketCapitalization?'$'+f(x.marketCapitalization,0)+'M':'–'),ln('Shares outstanding',x.shareOutstanding?f(x.shareOutstanding,1)+'M':'–'),ln('IPO date',x.ipo||'–'),ln('Sector / industry',esc(r.sec)+' / '+esc(p.ind)),ln('Next earnings',r.earn||'–'),ln('Peers',dp&&dp.peers.length?dp.peers.join(', '):'–')])+
 blk('5–8 · Growth, profit, balance sheet, returns',[ln('Revenue growth (TTM YoY)',f(m.revenueGrowthTTMYoy,1,'%')),ln('EPS growth (TTM YoY)',f(m.epsGrowthTTMYoy,1,'%')),ln('Gross / operating / net margin',f(m.grossMarginTTM,1,'%')+' / '+f(m.operatingMarginTTM,1,'%')+' / '+f(m.netProfitMarginTTM,1,'%')),ln('ROE / ROI / ROA',f(m.roeTTM,1,'%')+' / '+f(m.roiTTM,1,'%')+' / '+f(m.roaTTM,1,'%')),ln('Debt to equity',f(m['totalDebt/totalEquityQuarterly'])),ln('Current / quick ratio',f(m.currentRatioQuarterly)+' / '+f(m.quickRatioQuarterly)),ln('Interest coverage',f(m.netInterestCoverageTTM,1))])+
 blk('11–13 · Expectations, valuation, dividends',[ln('P/E / P/S / P/B',f(p.pe,1)+' / '+f(m.psTTM,1)+' / '+f(m.pbQuarterly,1)),ln('Price / free cash flow',f(m.pfcfShareTTM,1)),ln('Dividend yield / payout',f(m.dividendYieldIndicatedAnnual,2,'%')+' / '+f(m.payoutRatioTTM,1,'%')),ln('Analysts buy / hold / sell',an?(an.strongBuy+an.buy)+' / '+an.hold+' / '+(an.sell+an.strongSell):'–'),ln('Last 4 earnings surprises',dp&&dp.sur.length?dp.sur.map(v=>f(v,1,'%')).join(', '):'–'),ln('Insider buys / sells (90 days)',dp?dp.ib+' / '+dp.is:'–')])+
 blk('16 · Price and positioning',[ln('13 / 26 / 52-week return',f(m['13WeekPriceReturnDaily'],1,'%')+' / '+f(m['26WeekPriceReturnDaily'],1,'%')+' / '+f(m['52WeekPriceReturnDaily'],1,'%')),ln('52-week range',p.lo?'$'+f(p.lo)+' – $'+f(p.hi)+' ('+f(pos,0,'%')+' of range)':'–'),ln('Beta',f(p.beta))])+
 `<h3 style="margin:16px 0 4px">Needs manual research</h3><div class="m">Sections 2–4 (business model, industry, macro), 9–10 (dilution, forensic accounting), 14–15 (management, short interest, ownership), 17–19 (catalysts, risks, filings) and 21 (your decision sheet) can't be automated on free data.</div>
 <a href="https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${esc(sym)}&type=10-K" target="_blank" rel="noopener">Open ${esc(sym)} filings on SEC EDGAR</a>
 <div class="row" style="margin-top:10px;gap:8px"><button class="ch" onclick="cp(${JSON.stringify(sheet).replace(/"/g,'&quot;')})">Copy decision sheet</button><button class="ch" onclick="cp('Do a full deep dive on ${sym} using my 21-section checklist and today\'s data. Give a verdict, base/bull/bear values and what would prove me wrong.')">Copy prompt for Claude</button></div>
 <p class="m">Pass/fail thresholds are simple rules of thumb, not advice. Missing data shows n/a.</p>`;
 document.getElementById('dm').style.display='block'}
load();setInterval(load,60000);
</script><script src="extras.js"></script></body></html>
