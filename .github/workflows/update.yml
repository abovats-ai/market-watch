name: update
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: update
jobs:
  run:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python update.py
        env: {FINNHUB_KEY: "${{ secrets.FINNHUB_KEY }}"}
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add data.json; git commit -m "update" || exit 0; git push
